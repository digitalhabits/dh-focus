# Build extension zips + optional Mac/iOS App Store binaries, create a GitHub
# Release, and optionally submit to stores (never automatic on tag push).
#
# One App Store Connect record (id1660218371, com.ulriklyngs.mind-shield) covers
# both Mac and iOS. Submit jobs are independent of each other and of the GitHub
# Release job (same independence model as digital-habits-blocker / digital-habits-to-do).
#
# Trigger: Actions → "Release build" → Run workflow, or push tag v* (e.g. v6.8.0).
# Manual inputs:
#   create_github_release   — create GitHub Release from changelog.md (default: true)
#   submit_mac_app_store    — submit .pkg to App Store Connect (default: false)
#   submit_ios_app_store    — submit .ipa to App Store Connect (default: false)
#   submit_addon_stores     — submit to Chrome / Firefox / Edge (default: false)
#   mas_build_number / ios_build_number — override CURRENT_PROJECT_VERSION to
#                             re-upload the same marketing version
#
# Tag pushes create a GitHub Release (builds + attach assets) but do NOT submit
# to Mac, iOS, or browser add-on stores. Use the checkboxes on a manual Release
# run, or the standalone submit workflows (see docs/app-store-ci.md).
#
# Before shipping: bump version (scripts/bump-version.sh), add ## vX.Y.Z to
# changelog.md per changelog-style.md, commit to main.
# GitHub Release body = extract-changelog-section.sh (full markdown including
# Internal + platform tags). Store / AMO notes =
# changelog-to-store-whats-new.js (filtered plain text).
# Docs: docs/app-store-ci.md
#
# ── App Store Connect (build signing + submit) ──
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_P8          base64 of AuthKey_*.p8
#   ASC_PRIMARY_LOCALE                    optional; defaults to en-GB
#
# ── Chrome / Firefox / Edge (optional submit) ──
#   See docs/app-store-ci.md (CHROME_*, FIREFOX_*, EDGE_* secrets)

name: Release build

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: Create a GitHub Release (notes from changelog.md)
        type: boolean
        default: true
      submit_mac_app_store:
        description: Submit Mac App Store pkg to App Store Connect (What's new from changelog)
        type: boolean
        default: false
      submit_ios_app_store:
        description: Submit iOS IPA to App Store Connect (What's new from changelog)
        type: boolean
        default: false
      submit_addon_stores:
        description: Submit to Chrome / Firefox / Edge add-on stores
        type: boolean
        default: false
      mas_build_number:
        description: Override MAS CURRENT_PROJECT_VERSION (only to re-upload the same version)
        type: string
        default: ''
      ios_build_number:
        description: Override iOS CURRENT_PROJECT_VERSION (only to re-upload the same version)
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build-extension:
    name: Extension (.zip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Shared (Extension)/Resources/manifest.json','utf8')).version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" != "v${VERSION}" ]]; then
              echo "Tag ${TAG} does not match manifest.json version v${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Build shared extension zip (Chrome / Firefox)
        run: bash ./scripts/build-extension-zip.sh "${{ steps.meta.outputs.version }}"

      - name: Build Edge extension zip
        run: bash ./scripts/build-edge-extension-zip.sh "${{ steps.meta.outputs.version }}"

      - name: Upload extension artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            for-distribution/digital-habits-focus-v*.zip
            for-distribution/digital-habits-focus-edge-v*.zip
          if-no-files-found: error
          retention-days: 30

  # Builds always run (same graph shape as digital-habits-blocker). Secrets are checked
  # inside the job — GitHub forbids referencing `secrets` in job-level `if:`.
  build-macos:
    name: Mac App Store (.pkg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for Mac App Store build: ${missing[*]}. See docs/app-store-ci.md." >&2
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Mac App Store package
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MAS_BUILD_NUMBER: ${{ inputs.mas_build_number || '' }}
        run: bash ./scripts/build-appstore.sh macos

      - name: Upload Mac App Store artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-store-pkg
          path: for-distribution/digital-habits-focus_*.pkg
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: iOS (.ipa)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for iOS App Store build: ${missing[*]}. See docs/app-store-ci.md." >&2
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build App Store IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number || '' }}
        run: bash ./scripts/build-appstore.sh ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: for-distribution/digital-habits-focus_*.ipa
          if-no-files-found: error
          retention-days: 30

  # Mac App Store submit — independent of GitHub Release / iOS submit.
  # Manual checkbox only (tag pushes never auto-submit).
  publish-mac-app-store:
    name: Publish (Mac App Store)
    needs: [build-macos]
    runs-on: macos-latest
    timeout-minutes: 120
    if: >-
      needs.build-macos.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.submit_mac_app_store
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install fastlane
        run: brew install fastlane

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for Mac App Store submit: ${missing[*]}. See docs/app-store-ci.md — set these once, or uncheck submit_mac_app_store on manual runs." >&2
            exit 1
          fi

      - name: Download Mac App Store artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-store-pkg
          path: store-packages-mas

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Shared (Extension)/Resources/manifest.json','utf8')).version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog (macOS)
        id: notes
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform macos --empty-ok --out whats_new_mas.txt
          if [[ -s whats_new_mas.txt ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "=== What's new (macOS) ==="
            cat whats_new_mas.txt
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No macOS-facing changelog bullets for v${{ steps.meta.outputs.version }} — skipping Mac App Store submission."
          fi

      - name: Submit to App Store Connect
        if: steps.notes.outputs.has_notes == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_PRIMARY_LOCALE: ${{ secrets.ASC_PRIMARY_LOCALE }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          PKG="$(find store-packages-mas -type f -name '*.pkg' | head -1)"
          if [[ -z "$PKG" ]]; then
            echo "No .pkg found in store-packages-mas" >&2
            exit 1
          fi
          fastlane mac submit_mac_app_store \
            "version:${{ steps.meta.outputs.version }}" \
            "pkg:${PKG}" \
            "notes:whats_new_mas.txt"

  # iOS App Store submit — independent of GitHub Release / Mac submit.
  # Manual checkbox only (tag pushes never auto-submit).
  publish-ios-app-store:
    name: Publish (iOS App Store)
    needs: [build-ios]
    runs-on: macos-latest
    timeout-minutes: 120
    if: >-
      needs.build-ios.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.submit_ios_app_store
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install fastlane
        run: brew install fastlane

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for iOS App Store submit: ${missing[*]}. See docs/app-store-ci.md — set these once, or uncheck submit_ios_app_store on manual runs." >&2
            exit 1
          fi

      - name: Download iOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: store-packages-ios

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Shared (Extension)/Resources/manifest.json','utf8')).version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog (iOS)
        id: notes
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform ios --empty-ok --out whats_new_ios.txt
          if [[ -s whats_new_ios.txt ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "=== What's new (iOS) ==="
            cat whats_new_ios.txt
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No iOS-facing changelog bullets for v${{ steps.meta.outputs.version }} — skipping iOS App Store submission."
          fi

      - name: Submit to App Store Connect
        if: steps.notes.outputs.has_notes == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_PRIMARY_LOCALE: ${{ secrets.ASC_PRIMARY_LOCALE }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          IPA="$(find store-packages-ios -type f -name '*.ipa' | head -1)"
          if [[ -z "$IPA" ]]; then
            echo "No .ipa found in store-packages-ios" >&2
            exit 1
          fi
          fastlane ios submit_ios_app_store \
            "version:${{ steps.meta.outputs.version }}" \
            "ipa:${IPA}" \
            "notes:whats_new_ios.txt"

  # GitHub Release — proceeds when the extension zip is ready. Mac/iOS
  # artifacts are attached when those builds succeeded; store API outages do
  # not block this job (store submits are separate jobs above).
  publish-github-release:
    name: Publish (GitHub Release)
    needs: [build-extension, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.build-extension.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Download extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: artifacts/extension

      - name: Download Mac App Store artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-store-pkg
          path: artifacts/mas

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p for-distribution
          find artifacts/extension -type f \( -name 'digital-habits-focus-v*.zip' -o -name 'digital-habits-focus-edge-v*.zip' \) -exec cp -n {} for-distribution/ \;
          if [[ -d artifacts/mas ]]; then
            find artifacts/mas -type f -name '*.pkg' -exec cp -n {} for-distribution/ \;
          fi
          if [[ -d artifacts/ios ]]; then
            find artifacts/ios -type f -name '*.ipa' -exec cp -n {} for-distribution/ \;
          fi
          echo "Staged:"
          ls -la for-distribution

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('Shared (Extension)/Resources/manifest.json','utf8')).version)")"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match manifest.json version v${VERSION}" >&2
            exit 1
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          bash ./scripts/extract-changelog-section.sh "$VERSION" > /tmp/changelog-section.md
          # Full markdown section (including Internal + [platform] tags).
          # Store / AMO notes are built separately by changelog-to-store-whats-new.js.
          {
            cat /tmp/changelog-section.md
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo ""
            echo "- **Browser extension (Chrome / Firefox):** download \`digital-habits-focus-v${VERSION}.zip\` for store upload or sideload."
            echo "- **Browser extension (Edge):** download \`digital-habits-focus-edge-v${VERSION}.zip\` (Partner Center rejects the shared zip’s dual background keys)."
            if [[ -f for-distribution/digital-habits-focus_${VERSION}.pkg ]]; then
              echo "- **Mac App Store package:** \`digital-habits-focus_${VERSION}.pkg\` (App Store Connect / Transporter)."
            fi
            if [[ -f for-distribution/digital-habits-focus_${VERSION}.ipa ]]; then
              echo "- **iOS App Store package:** \`digital-habits-focus_${VERSION}.ipa\` (App Store Connect / Transporter)."
            fi
            echo ""
            echo "GitHub also attaches **Source code (zip)** and **Source code (tar.gz)** automatically for this tag."
            echo ""
            echo "**Full changelog:** https://github.com/${{ github.repository }}/blob/main/changelog.md"
            echo ""
            echo "Store submits are **manual**: tick checkboxes on **Release build**, or run **Submit to add-on stores (Chrome, Firefox, Edge).** / Mac / iOS submit workflows. See \`docs/app-store-ci.md\`."
          } > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Digital Habits: Focus v${{ steps.meta.outputs.version }}"
          body_path: release-notes.md
          files: |
            for-distribution/digital-habits-focus-v*.zip
            for-distribution/digital-habits-focus-edge-v*.zip
            for-distribution/digital-habits-focus_*.pkg
            for-distribution/digital-habits-focus_*.ipa
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: false

  # Browser add-on stores — manual checkbox only (never on tag push).
  # Parallel Chrome / Firefox / Edge jobs live in the reusable workflow.
  submit-addon-stores:
    name: Submit to add-on stores
    needs: [build-extension]
    if: >-
      needs.build-extension.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.submit_addon_stores
    uses: ./.github/workflows/addon-store-submit.yml
    with:
      version: ${{ needs.build-extension.outputs.version }}
      packages_from_artifacts: true
      submit_chrome: true
      submit_firefox: true
      submit_edge: true
    secrets: inherit
