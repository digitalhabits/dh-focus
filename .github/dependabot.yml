# Update pull requests for the GitHub Actions the release workflows use.
# Runs once a week on its own; to run it by hand, go to Insights → Dependency
# graph → Dependabot. All action updates come in one PR, and open PRs are never
# rebased automatically; comment "@dependabot rebase" on one to refresh it.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns: ["*"]
